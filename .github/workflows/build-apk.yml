name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure stable debug keystore exists
        id: keystore
        working-directory: mobile-app/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Football Stats Pro, OU=Dev, O=Dev, L=Unknown, ST=Unknown, C=US"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new keystore (solo la primera vez que se genera)
        if: steps.keystore.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile-app/android/app/debug.keystore
          git commit -m "Agregar keystore de debug estable para firmar el APK siempre igual [automatico]"
          git push

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Sync web app into Capacitor project
        working-directory: mobile-app
        run: npm run sync-web

      - name: Capacitor sync (regenerates capacitor-cordova-android-plugins)
        working-directory: mobile-app
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(find mobile-app/android/app/build/outputs/apk/debug -name '*.apk')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-pro-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish/replace "latest" release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Football Stats Pro (build automático)
          body: APK generado automáticamente desde el último push a main. Descárgalo e instálalo en tu celular Android.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar el APK tambien en GitHub Pages (mismo dominio que la app web)
        # El link de "Releases" redirige a release-assets.githubusercontent.com con una
        # URL larga y firmada -- algunas redes/navegadores en celular se traban ahi
        # aunque github.com cargue bien. Sirviendo el APK desde el mismo dominio de
        # GitHub Pages que ya carga la app se evita esa redireccion por completo.
        run: |
          cp "${{ steps.apk.outputs.path }}" app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git diff --staged --quiet && echo "APK sin cambios." || (git commit -m "Actualizar APK publicado en GitHub Pages [automatico]" && git pull --rebase && git push)
