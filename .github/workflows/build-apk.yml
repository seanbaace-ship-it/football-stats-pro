name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile-app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Sync web app into Capacitor project
        working-directory: mobile-app
        run: npm run sync-web

      - name: Capacitor sync (regenerates capacitor-cordova-android-plugins)
        working-directory: mobile-app
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(find mobile-app/android/app/build/outputs/apk/debug -name '*.apk')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-stats-pro-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish/replace "latest" release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Football Stats Pro (build automático)
          body: APK generado automáticamente desde el último push a main. Descárgalo e instálalo en tu celular Android.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
